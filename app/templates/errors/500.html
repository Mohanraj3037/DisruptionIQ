{% extends "base.html" %}

{% block title %}500 Internal Error{% endblock %}

{% block content %}
<div class="row justify-content-center align-items-center" style="min-height: 60vh;">
  <div class="col-12 col-md-8 col-lg-6 text-center">
    <div class="control-card p-5">
      <div class="mb-3">
        <i class="bi bi-exclamation-triangle-fill text-danger" style="font-size: 3.5rem;"></i>
      </div>
      <h2 class="h4 text-white fw-bold mb-2">500 &bull; Internal Server Error</h2>
      <p class="text-secondary mb-4" style="font-size: 0.95rem;">
        An unexpected server error occurred while processing your request. The transaction has been rolled back.
      </p>
      <div class="d-flex justify-content-center gap-3">
        <a href="{{ url_for('dashboard.index') }}" class="btn btn-control-gold">
          <i class="bi bi-arrow-left me-1"></i> Return to Control Tower
        </a>
      </div>
    </div>
  </div>
</div>
{% endblock %}
